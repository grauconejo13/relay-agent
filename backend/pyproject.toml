[project]
name = "relay-backend"
version = "0.1.0"
description = "Relay autonomous handoff agent backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "google-adk>=1.12,<2.0",
  "google-cloud-firestore>=2.21,<3.0",
  "google-cloud-pubsub>=2.31,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.12,<1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
